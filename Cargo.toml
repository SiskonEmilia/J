[package]
name = "j"
version = "0.3.1"
description = "Fast directory jump tool for Windows and macOS shells with nested symbol tree and reusable path templates"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/SiskonEmilia/J"
authors = ["SiskonEmilia"]
readme = "README.md"

[lib]
name = "j"
path = "src/lib.rs"

[[bin]]
name = "j"
path = "src/main.rs"

[dependencies]
jsonc-parser = { version = "0.26", features = ["cst", "serde"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
insta = "1.41"
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
